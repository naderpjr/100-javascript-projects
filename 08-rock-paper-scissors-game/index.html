<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main class="container">
        <header class="header">
            <h1>Rock Paper Scissors</h1>
            <p>Choose your move and play against the computer.</p>
        </header>

        <section class="game-card">
            <p class="section-label">MAKE YOUR MOVE</p>

            <div class="buttons">
                <button class="choice-button" id="rock" type="button" aria-label="Choose rock">
                    <span class="choice-icon" aria-hidden="true">&#x1F44A;</span>
                    <span class="choice-name">Rock</span>
                </button>

                <button class="choice-button" id="paper" type="button" aria-label="Choose paper">
                    <span class="choice-icon" aria-hidden="true">&#x1F590;</span>
                    <span class="choice-name">Paper</span>
                </button>

                <button class="choice-button" id="scissors" type="button" aria-label="Choose scissors">
                    <span class="choice-icon" aria-hidden="true">&#x270C;&#xFE0F;</span>
                    <span class="choice-name">Scissors</span>
                </button>
            </div>

            <div class="result-box" aria-live="polite">
                <p class="result-label">ROUND RESULT</p>
                <p id="result">Choose a move to start playing.</p>
                <p id="round-details"></p>
            </div>
        </section>

        <section class="score-card">
            <div class="score-item">
                <span class="score-label">YOU</span>
                <span class="score-value" id="user-score">0</span>
            </div>

            <div class="score-divider"></div>

            <div class="score-item">
                <span class="score-label">COMPUTER</span>
                <span class="score-value" id="computer-score">0</span>
            </div>
        </section>

        <button class="reset-button" id="reset" type="button">Reset Score</button>
    </main>
</body>

</html>
